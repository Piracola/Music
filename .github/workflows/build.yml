name: Build

on:
    workflow_dispatch:

jobs:
    build-meta:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Generate build metadata
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  BRANCH=${GITHUB_REF_NAME}
                  COMMIT=${GITHUB_SHA}
                  echo "{\"branch\":\"${BRANCH}\",\"version\":\"${VERSION}\",\"commit\":\"${COMMIT}\"}" > build-meta.json
                  cat build-meta.json
            - uses: actions/upload-artifact@v6
              with:
                  name: build-meta
                  path: build-meta.json
                  retention-days: 30

    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Read version
              run: |
                  $version = node -p "require('./package.json').version"
                  echo "VERSION=$version" >> $env:GITHUB_ENV
            - run: pnpm run package
            - name: Install Inno Setup
              shell: pwsh
              run: |
                  choco install innosetup --no-progress -y
                  # Inno Setup 官方不附中文语言文件，CI 里现取一份放进 Languages 目录
                  $langDir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
                  Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile (Join-Path $langDir "ChineseSimplified.isl")
            - name: Build installer
              shell: pwsh
              run: |
                  $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
                  & $iscc "/DMyAppVersion=$env:VERSION" "./release/build-windows.iss"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            - name: Rename setup file
              run: |
                  Rename-Item -Path "./out/MusicSetup.exe" -NewName "Music-${{ env.VERSION }}-win32-x64-setup.exe"
            - name: Generate portable
              run: |
                  New-Item -ItemType Directory -Path "./out/Music-win32-x64/portable" -Force
                  New-Item -ItemType File -Path "./out/Music-win32-x64/portable/.portable" -Force
            - name: Archive portable
              run: |
                  Compress-Archive -Path "./out/Music-win32-x64/*" -DestinationPath "./out/Music-${{ env.VERSION }}-win32-x64-portable.zip"
            - uses: actions/upload-artifact@v6
              with:
                  name: Music-${{ env.VERSION }}-win32-x64-setup
                  path: ./out/Music-${{ env.VERSION }}-win32-x64-setup.exe
                  retention-days: 30
            - uses: actions/upload-artifact@v6
              with:
                  name: Music-${{ env.VERSION }}-win32-x64-portable
                  path: ./out/Music-${{ env.VERSION }}-win32-x64-portable.zip
                  retention-days: 30

    build-macos-x64:
        runs-on: macos-15-intel
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - name: Fix node-gyp for Python 3.12+
              run: pip install setuptools
            - run: pnpm install --frozen-lockfile
            - name: Read version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
            - run: pnpm run make
            - name: Rename DMG
              run: mv "./out/make/Music-${{ env.VERSION }}-x64.dmg" "./out/make/Music-${{ env.VERSION }}-darwin-x64.dmg"
            - uses: actions/upload-artifact@v6
              with:
                  name: Music-${{ env.VERSION }}-darwin-x64
                  path: ./out/make/Music-${{ env.VERSION }}-darwin-x64.dmg
                  retention-days: 30

    build-macos-arm64:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - name: Fix node-gyp for Python 3.12+
              run: pip install setuptools
            - run: pnpm install --frozen-lockfile
            - name: Read version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
            - run: pnpm run make -- --arch=arm64
            - name: Rename DMG
              run: mv "./out/make/Music-${{ env.VERSION }}-arm64.dmg" "./out/make/Music-${{ env.VERSION }}-darwin-arm64.dmg"
            - uses: actions/upload-artifact@v6
              with:
                  name: Music-${{ env.VERSION }}-darwin-arm64
                  path: ./out/make/Music-${{ env.VERSION }}-darwin-arm64.dmg
                  retention-days: 30

    build-linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Read version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "VERSION=$VERSION" >> $GITHUB_ENV
            - run: pnpm run make -- --targets=@electron-forge/maker-deb
            - name: Rename DEB
              run: |
                  DEB_FILE=$(find ./out/make/deb/x64/ -name "*.deb" | head -1)
                  if [ -n "$DEB_FILE" ]; then
                    mv "$DEB_FILE" "./out/make/deb/x64/Music-${{ env.VERSION }}-linux-amd64.deb"
                  fi
            - uses: actions/upload-artifact@v6
              with:
                  name: Music-${{ env.VERSION }}-linux-amd64-deb
                  path: ./out/make/deb/x64/Music-${{ env.VERSION }}-linux-amd64.deb
                  retention-days: 30
